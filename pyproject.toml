[project]
name = "sandboxer"
version = "0.1.0"
description = "A context aware CLI that generates data for your sandbox."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "pathspec==1.1.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
]

[tool.uv]
package = false
required-version = ">=0.12.23"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]

name: Build executables

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release versioning
        run: python -m unittest discover -s tests -v
      - id: version
        env:
          SEQUENCE: ${{ github.run_number }}
        run: echo "version=$(python scripts/release_version.py --sequence "$SEQUENCE")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            executable: sandboxer
          - os: windows-2022
            target: windows-x86_64
            executable: sandboxer.exe
          - os: macos-15
            target: macos-arm64
            executable: sandboxer
          - os: macos-15-intel
            target: macos-x86_64
            executable: sandboxer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Build native executable
        run: python scripts/build.py --version "${{ env.VERSION }}"
      - name: Smoke test executable
        run: python scripts/smoke_test.py dist/${{ matrix.executable }} --version "${{ env.VERSION }}"
      - name: Archive executable and documentation
        shell: python
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          import os
          from pathlib import Path
          import shutil
          import tempfile

          Path('artifacts').mkdir()
          with tempfile.TemporaryDirectory() as staging:
              for source in (Path('dist') / os.environ['EXECUTABLE'], Path('README.md'), Path('LICENSE')):
                  shutil.copy2(source, staging)
              archive_format = 'zip' if os.name == 'nt' else 'gztar'
              shutil.make_archive('artifacts/sandboxer-' + os.environ['VERSION'] + '-' + os.environ['TARGET'], archive_format, staging)
      - name: Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: sandboxer-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.run_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sandboxer-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete release and create checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import os

          folder = Path('artifacts')
          expected = {
              f"sandboxer-{os.environ['VERSION']}-{target}.{extension}"
              for target, extension in (
                  ('linux-x86_64', 'tar.gz'), ('windows-x86_64', 'zip'),
                  ('macos-arm64', 'tar.gz'), ('macos-x86_64', 'tar.gz'),
              )
          }
          actual = {p.name for p in folder.iterdir() if p.is_file()}
          if actual != expected:
              raise RuntimeError(f'Incomplete release: expected {expected}, got {actual}')
          checksums = ''.join(f'{hashlib.sha256((folder / name).read_bytes()).hexdigest()}  {name}\n' for name in sorted(expected))
          (folder / 'SHA256SUMS').write_text(checksums, encoding='utf-8')
      - name: Publish all platform archives together
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # A rerun resumes a draft; a published release is never overwritten.
          if gh release view "$tag" --json isDraft > release.json; then
            if [ "$(python -c 'import json; print(json.load(open("release.json"))["isDraft"])')" = "False" ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$COMMIT" --title "Sandboxer $VERSION" --draft --prerelease --notes "Automated prerelease from commit $COMMIT. Download the archive for your operating system and verify it against SHA256SUMS."
          fi
          gh release upload "$tag" artifacts/* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false

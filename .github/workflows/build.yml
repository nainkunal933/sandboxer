name: Build executables

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sandboxer-release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Select release version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Select version from merged PR labels
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const { prepareRelease } = require('./.github/scripts/release.cjs');
            const result = await prepareRelease({ github, context });
            for (const [name, value] of Object.entries(result)) core.setOutput(name, value);
            core.info(JSON.stringify(result));

  build:
    name: ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            executable: sandboxer
          - os: windows-2022
            target: windows-x86_64
            executable: sandboxer.exe
          - os: macos-15
            target: macos-arm64
            executable: sandboxer
          - os: macos-15-intel
            target: macos-x86_64
            executable: sandboxer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: uv version "$RELEASE_VERSION" --no-sync
      - name: Install locked build dependencies
        run: uv sync --locked --group build
      - name: Check dependencies
        run: uv pip check
      - name: Build native executable
        run: uv run --locked --group build scripts/build.py
      - name: Archive executable and documentation
        shell: python
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          import os
          from pathlib import Path
          import shutil
          import tempfile

          Path('artifacts').mkdir()
          with tempfile.TemporaryDirectory() as staging:
              for source in (Path('dist') / os.environ['EXECUTABLE'], Path('README.md'), Path('LICENSE')):
                  shutil.copy2(source, staging)
              archive_format = 'zip' if os.name == 'nt' else 'gztar'
              shutil.make_archive('artifacts/sandboxer-' + os.environ['TARGET'], archive_format, staging)
      - name: Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: sandboxer-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish binary release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download native archives
        uses: actions/download-artifact@v4
        with:
          pattern: sandboxer-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/release.cjs');
            const result = await publishRelease({ github, context, tag: process.env.RELEASE_TAG });
            core.info(`${process.env.RELEASE_TAG}: ${result}`);
